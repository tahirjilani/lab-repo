org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# DemoWallet lab switches. Override on the command line with -P<name>=<value>.
# ---------------------------------------------------------------------------

# Lab 2: bind a Play Integrity token to the transfer hash in WalletApi.kt.
# false on lab1-start; true on lab2-start and main.
demowallet.integrityBinding=false

# Google Cloud project number linked in Play Console (Play Integrity API).
# 0 = not configured: the app sends integrity.error = "NOT_CONFIGURED" as evidence
# and the server should treat that as a failed verdict (step-up).
demowallet.cloudProjectNumber=0

# Backend. http://10.0.2.2:8000 = server/ running on the host, as seen from the emulator
# (start it first: see docs/setup.md). All lab branches use the server.
# "mock" = in-app fake server, for a quick look without Python:
#   ./gradlew installDebug -Pdemowallet.apiBaseUrl=mock
# Real phone over USB: adb reverse tcp:8000 tcp:8000 and use http://127.0.0.1:8000
demowallet.apiBaseUrl=http://10.0.2.2:8000

# Agent limit (deck slide 18): the most the user can delegate to the assistant in one
# scoped token, in cents. Keep equal to the server's DW_AGENT_LIMIT_CENTS (default 10000).
demowallet.agentLimitCents=10000
